name: E2E Tests

on:
  push: 
    branches: '*'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'crates/**'
  #     - 'packages/**'
  #     - 'examples/0.80/**'
  # pull_request: null

jobs:
  build:
    runs-on: macos-latest
    name: Build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          toolchain: nightly-2025-08-04
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to PATH
        run: echo "${HOME}/.maestro/bin" >> $GITHUB_PATH
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Install dependencies
        run: yarn install --immutable
      - name: Prepare CrabyModules
        run: cargo xtask prepare
      - name: Packing
        run: yarn workspace craby-test pack --out package.tgz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-module
          path: examples/craby-test/package.tgz
          if-no-files-found: error

  e2e-android:
    runs-on: ubuntu-latest
    name: E2E Android
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          toolchain: nightly-2025-08-04
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to PATH
        run: echo "${HOME}/.maestro/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: yarn install --immutable
      - name: Prepare shared
        run: yarn workspace shared build
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: prebuilt-module
          path: examples/0.80
      - name: Install package
        run: yarn add ./package.tgz
        working-directory: examples/0.80
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-29
      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Build Android app
        run: ./gradlew assembleRelease
        working-directory: examples/0.80/android
      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd "$GITHUB_WORKSPACE/examples/0.80/android"
            APK_PATH=$(find . -name "*.apk" -path "*/outputs/apk/release/*" | head -n 1)
            if [ ! -d "$APK_PATH" ]; then
              echo "Error: App not found at $APK_PATH"
              exit 1
            fi
            adb install -r "$APK_PATH"
            cd "$GITHUB_WORKSPACE/examples/0.80"
            yarn e2e:android

  e2e-ios:
    runs-on: macos-latest
    name: E2E iOS
    needs:
      - build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          toolchain: nightly-2025-08-04
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to PATH
        run: echo "${HOME}/.maestro/bin" >> $GITHUB_PATH
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Install dependencies
        run: yarn install --immutable
      - name: Prepare shared
        run: yarn workspace shared build
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: prebuilt-module
          path: examples/0.80
      - name: Install package
        run: yarn add ./package.tgz
        working-directory: examples/0.80
      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: examples/0.80/ios
      - name: Build iOS app
        run: |
          xcodebuild \
            -workspace Craby80.xcworkspace \
            -scheme Craby80 \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$HOME/DerivedData" \
            -quiet
        working-directory: examples/0.80/ios
      - name: Install app
        run: |
          APP_PATH=$(find "$HOME/DerivedData/Build/Products/Release-iphonesimulator" -name "*.app" | head -n 1)
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: App not found at $APP_PATH"
            echo "Contents of Release-iphonesimulator:"
            ls -la "$HOME/DerivedData/Build/Products/Release-iphonesimulator/" || true
            exit 1
          fi
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl install booted "$APP_PATH"
      - name: Run E2E tests
        run: yarn e2e:ios
        working-directory: examples/0.80
