name: E2E Tests

on:
  push: 
    branches: '*'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - 'crates/**'
  #     - 'packages/**'
  #     - 'examples/0.80/**'
  # pull_request: null

jobs:
  e2e-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          toolchain: nightly-2025-08-04
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to PATH
        run: echo "${HOME}/.maestro/bin" >> $GITHUB_PATH
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
      - name: Install dependencies
        run: yarn install --immutable
      - name: Prepare CrabyModules
        run: yarn prepare
      - name: Install CocoaPods dependencies
        run: yarn pod:install
        working-directory: examples/0.80
      - name: Build iOS app
        run: |
          xcodebuild -workspace Craby80.xcworkspace -scheme Craby80 -configuration Release -sdk iphonesimulator
        working-directory: examples/0.80/ios
      - name: Install app
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphonesimulator -name "*.app" | head -n 1)
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl install booted "$APP_PATH"
      - name: Run Maestro tests
        run: yarn e2e:ios

  e2e-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [36]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          toolchain: nightly-2025-08-04
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash
      - name: Add Maestro to PATH
        run: echo "${HOME}/.maestro/bin" >> $GITHUB_PATH
      - name: Install dependencies
        run: yarn install --immutable
      - name: Prepare CrabyModules
        run: yarn prepare
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}
      - name: Starting ADB
        run: |
          /usr/local/lib/android/sdk/platform-tools/adb kill-server
          /usr/local/lib/android/sdk/platform-tools/adb start-server
      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd examples/0.80/android
            ./gradlew installRelease --build-cache
            yarn e2e:android
